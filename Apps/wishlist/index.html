<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Dream Wishlist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #1e1f22; color: #fff; }
        .card-stat { background-color: #2b2d31; border: 1px solid #3f4248; border-radius: 8px; text-align: center; padding: 20px; }
        .form-container { background-color: #2b2d31; padding: 20px; border-radius: 8px; border: 1px solid #3f4248; }
        
        .text-muted { color: #b3b9c1 !important; }
        .form-label { color: #e3e6eb !important; }
        .table-custom th { background-color: #232428; color: #e3e6eb; border: none; }

        .form-container input, .form-container select { 
            background-color: #1e1f22 !important; 
            color: #ffffff !important; 
            border: 1px solid #4e525a !important; 
            display: block; 
            width: 100%; 
            padding: 8px; 
            border-radius: 5px;
        }
        .form-container input::placeholder { color: #72767d !important; }
        .form-container input:focus, .form-container select:focus {
            border-color: #ffb703 !important;
            outline: none;
            box-shadow: 0 0 5px rgba(255, 183, 3, 0.5);
        }

        .table-custom { background-color: #2b2d31; color: #fff; border-radius: 8px; overflow: hidden; }
        .table-custom td { border-bottom: 1px solid #3f4248; background-color: #2b2d31; color: #fff; vertical-align: middle; }
    </style>
</head>
<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 style="color: #ffb703; font-weight: bold; margin-bottom: 0;">CS2 DREAM WISHLIST</h1>
        <a href="../../index.html" class="btn btn-outline-light btn-sm">← Zpět na Portfolio</a>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card-stat">
                <small class="text-muted text-uppercase fw-bold">Celková cena</small>
                <h2 class="fw-bold mt-1" id="celkovaCena">0 €</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-stat">
                <small class="text-muted text-uppercase fw-bold">Hodnota vlastněných</small>
                <h2 class="fw-bold mt-1" style="color: #00b4d8;" id="hodnotaVlastnenych">0 €</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-stat">
                <small class="text-muted text-uppercase fw-bold">Zbývá doplatit</small>
                <h2 class="fw-bold mt-1" style="color: #ffb703;" id="zbyvaDoplatit">0 €</h2>
            </div>
        </div>
    </div>

    <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
        <span id="errorMessage"></span>
        <button type="button" class="btn-close" onclick="skrytChybu()"></button>
    </div>

    <div class="form-container mb-4">
        <form id="skinForm" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label small text-uppercase fw-bold">Název skinu</label>
                <input type="text" id="skinName" placeholder="Např. AWP | Asiimov" required>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-uppercase fw-bold">Cena (€)</label>
                <input type="number" id="skinPrice" step="0.01" placeholder="0.00" required>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-uppercase fw-bold">Float</label>
                <input type="text" id="skinFloat" placeholder="Např. 0.15">
            </div>
            <div class="col-md-2">
                <label class="form-label small text-uppercase fw-bold">Rarita</label>
                <select id="skinRarity">
                    <option value="Covert">Covert (Červená)</option>
                    <option value="Classified">Classified (Růžová)</option>
                    <option value="Restricted">Restricted (Fialová)</option>
                    <option value="Mil-Spec">Mil-Spec (Modrá)</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-warning w-100 fw-bold" style="background-color: #ffb703; border: none; color: #1e1f22; padding: 9px;">Přidat skin</button>
            </div>
        </form>
    </div>

    <table class="table table-custom">
        <thead>
            <tr>
                <th>Status</th>
                <th>Předmět</th>
                <th>Aktuální trh</th>
                <th>Float</th>
                <th class="text-center">Akce</th>
            </tr>
        </thead>
        <tbody id="skinTableBody">
            </tbody>
    </table>

    <script>
        let skiny = JSON.parse(localStorage.getItem('skiny')) || [];

        const form = document.getElementById('skinForm');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        function skrytChybu() { errorAlert.classList.add('d-none'); }

        // HLAVNÍ FUNKCE PRO VYKRESLENÍ A VÝPOČTY
        function aktualizovatWeb() {
            const tbody = document.getElementById('skinTableBody');
            tbody.innerHTML = '';

            if (skiny.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Tvůj wishlist je prázdný. Přidej svůj první skin!</td></tr>`;
                document.getElementById('celkovaCena').innerText = '0 €';
                document.getElementById('hodnotaVlastnenych').innerText = '0 €';
                document.getElementById('zbyvaDoplatit').innerText = '0 €';
                localStorage.setItem('skiny', JSON.stringify(skiny));
                return;
            }

            let celkovaCena = 0;
            let hodnotaVlastnenych = 0;

            skiny.forEach((skin, index) => {
                celkovaCena += skin.cena;
                if (skin.koupeno) {
                    hodnotaVlastnenych += skin.cena;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <button onclick="zmenitStatus(${index})" class="btn btn-sm ${skin.koupeno ? 'btn-success' : 'btn-outline-secondary'}">
                            ${skin.koupeno ? '✓ Koupeno' : 'Chci koupit'}
                        </button>
                    </td>
                    <td class="fw-bold">${skin.nazev} <br><small class="text-muted">${skin.rarita}</small></td>
                    <td>${skin.cena.toFixed(2)} €</td>
                    <td>${skin.float_value || '-'}</td>
                    <td class="text-center">
                        <button onclick="smazatSkin(${index})" class="btn btn-danger btn-sm">Smazat</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Výpočty
            let zbyvaDoplatit = celkovaCena - hodnotaVlastnenych;

            document.getElementById('celkovaCena').innerText = celkovaCena.toFixed(2) + ' €';
            document.getElementById('hodnotaVlastnenych').innerText = hodnotaVlastnenych.toFixed(2) + ' €';
            document.getElementById('zbyvaDoplatit').innerText = zbyvaDoplatit.toFixed(2) + ' €';

            // Uložení do paměti prohlížeče
            localStorage.setItem('skiny', JSON.stringify(skiny));
        }

        // PŘÍDÁNÍ SKINU S VALIDACÍ (Záporná čísla)
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            skrytChybu();

            const nazev = document.getElementById('skinName').value;
            const cena = parseFloat(document.getElementById('skinPrice').value);
            const float_value = document.getElementById('skinFloat').value;
            const rarita = document.getElementById('skinRarity').value;

            // VALIDACE: Kontrola záporné ceny
            if (cena <= 0) {
                errorMessage.innerText = 'Chyba: Cena skinu musí být větší než 0 €!';
                errorAlert.classList.remove('d-none');
                return;
            }

            skiny.push({
                nazev: nazev,
                cena: cena,
                float_value: float_value,
                rarita: rarita,
                koupeno: false
            });

            form.reset();
            aktualizovatWeb();
        });

        // FUNKCE PRO TLAČÍTKA
        function zmenitStatus(index) {
            skiny[index].koupeno = !skiny[index].koupeno;
            aktualizovatWeb();
        }

        function smazatSkin(index) {
            skiny.splice(index, 1);
            aktualizovatWeb();
        }

        // První načtení dat při otevření stránky
        aktualizovatWeb();
    </script>
</body>
</html>
